<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e9f8f5">
    <meta name="description" content="查詢臺北市 YouBike 2.0 即時站點與可借、可還數量。">
    <title>YouBike 即時站點查詢</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">Y</span>
            <span>YouBike <span class="brand-light">臺北</span></span>
          </div>
          <button id="refresh-button" class="icon-button refresh-button" type="button" aria-label="重新整理站點資料">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.6 9a7 7 0 0 1 11.6-2L20 12M4 17v-5h5m10.4 3a7 7 0 0 1-11.6 2L4 12"/></svg>
          </button>
        </div>
        <p class="eyebrow">TAIPEI · BIKE SHARE</p>
        <h1>下一站，<span>騎去哪？</span></h1>
        <p class="hero-copy">即時掌握附近站點的可借車輛與空位</p>
        <div class="live-pill"><span class="live-dot"></span>臺北市 YouBike 2.0 即時資料</div>
      </header>

      <section class="content" aria-label="站點查詢">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search-input" type="search" placeholder="搜尋站點或路名" autocomplete="off" aria-label="搜尋站點或路名">
          <kbd>Ctrl K</kbd>
        </div>

        <div class="filter-row">
          <label class="district-select">
            <span class="sr-only">選擇行政區</span>
            <select id="district-select" aria-label="依行政區篩選">
              <option value="">全部行政區</option>
            </select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </label>
          <button id="favorites-filter" class="filter-chip" type="button" aria-pressed="false">
            <span aria-hidden="true">☆</span> 我的收藏
          </button>
        </div>

        <div class="section-heading">
          <div>
            <p class="eyebrow dark-eyebrow">TAIPEI STATIONS</p>
            <h2>站點列表 <span id="result-count" class="result-count"></span></h2>
          </div>
          <span id="updated-at" class="updated-at" aria-live="polite"></span>
        </div>

        <div id="status-banner" class="status-banner" role="status" hidden></div>
        <div id="station-list" class="station-list" aria-live="polite" aria-busy="false"></div>
        <footer class="footer-note">資料來源：臺北市 YouBike 2.0 公開即時資料</footer>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
